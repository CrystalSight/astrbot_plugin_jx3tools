name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install quality tools
        run: python -m pip install "ruff>=0.15.0" "pyright>=1.1.400" "pytest>=8.4.1" "pytest-asyncio>=1.1.0"
      - name: Compile
        run: python -m compileall -q .
      - name: Ruff
        run: ruff check .
      - name: Pyright
        run: pyright
      - name: Pytest
        run: pytest -q
